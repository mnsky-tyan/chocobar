name: CI

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: C compile check
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64
          bash native/build.sh --check

      - name: Test
        run: |
          node scripts/portable_regression.js
