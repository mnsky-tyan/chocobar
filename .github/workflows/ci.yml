# HAND-MAINTAINED - do not regenerate with `no-mistakes ci-workflow`.
# Regeneration emits an unconditional actions/setup-go step (this repo has no
# Go) and drops the mingw install; edit this file by hand instead. The pinned
# lint command needs no separate setup: `bash native/build.sh --check`
# installs the distro mingw itself when no local toolchain exists.
name: CI

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: C compile check
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64
          bash native/build.sh --check

      - name: Test
        run: |
          node scripts/portable_regression.js
