# no-mistakes repo config - chocobar
#
# Deterministic checks, and the rule that protects the user's live bar.

commands:
  # The portable regression suite is the whole deterministic test surface.
  # It is pure source/config inspection + assertions; it launches nothing and
  # pops no window.
  test: "node scripts/portable_regression.js"

  # Compile-only C gate: syntax + -Wall -Wextra over the amalgamated source,
  # no link, no exe written.
  lint: "bash native/build.sh --check"

# The Test step is an agent, so it also reads AGENTS.md. The live bar at
# C:\Users\tyanw\review\chocobar\native\chocobar.exe is the user's running
# status bar, NOT a test fixture. It must never be stopped to free the
# single-instance mutex.
#
# If a validation genuinely needs to RUN the bar, launch a scratch copy in
# isolation on the `second` Windows virtual desktop via `win-hidden-launch`
# (~/.local/bin), pointed at a throwaway --config and scratch profile. If it
# cannot be isolated, do not run it - report the gap instead.
test:
  notes: >-
    NEVER kill, stop, or restart the user's bar. It is a PUBLISHED RELEASE at
    C:\Users\tyanw\review\chocobar\native\chocobar.exe (HKCU Run value
    "Chocobar") and it is the thing the user looks at all day; it does not come
    back on its own. The single-instance mutex is a fixed name
    (APP_MUTEX="ChocobarSingleInstanceMutex"), so a test copy CANNOT run
    alongside it - it exits immediately with ERROR_ALREADY_EXISTS. That is NOT a
    failure of your build; do not stop the user's bar to "make room".
    A dev bar belongs on the Windows 'second' desktop via win-hidden-launch with
    its own --config (see ~/.local/bin/cbdev and AGENTS.md, "The development
    split"). Prefer validating the bar's DATA PATH from the log and the source
    over running a second instance. If a validation needs the bar running and
    cannot be isolated, report the gap instead of taking the user's screen.
