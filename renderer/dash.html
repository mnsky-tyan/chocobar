<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <link rel="stylesheet" href="dash.css">
</head>
<body>
  <div id="card">
    <div id="titlebar">
      <div id="title">
        <span class="logo">◇</span> Token Usage
        <span id="subtitle">all CLIs · user total</span>
      </div>
      <div id="titlebar-right">
        <button id="btn-refresh" title="Rescan sources">refresh</button>
        <button id="btn-close" title="Close">✕</button>
      </div>
    </div>

    <div id="statcards"></div>

    <div class="section">
      <div class="section-head">
        <span>Daily usage</span>
        <span id="heat-legend" class="legend"></span>
      </div>
      <div id="heatmap-wrap">
        <div id="heatmap"></div>
        <div id="heat-tip" class="hidden"></div>
      </div>
      <div id="day-detail" class="hidden"></div>
    </div>

    <div id="tables">
      <div class="section table-sec">
        <div class="section-head"><span>By app</span></div>
        <div id="app-table"></div>
      </div>
      <div class="section table-sec">
        <div class="section-head"><span>By model</span></div>
        <div id="model-table"></div>
      </div>
    </div>

    <div id="footer">sources: zcode · zai · opencode · mimo — <span id="scan-info"></span></div>
  </div>
  <script src="dash.js"></script>
</body>
</html>
